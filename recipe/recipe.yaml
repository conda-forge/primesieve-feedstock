context:
  version: "12.15"

package:
  name: primesieve
  version: ${{ version }}

source:
  url: https://github.com/kimwalisch/primesieve/archive/refs/tags/v${{ version }}.tar.gz
  sha256: acaafd94cc30dbeef4808e682d0cb096c05d25f74eda5bacecefd323f697833f

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
  run_exports:
    - ${{ pin_subpackage('primesieve', upper_bound='x.x') }}

tests:
  - package_contents:
      include:
        - primesieve.h
      lib:
        - primesieve
  - script:
      # Test CLIs.
      - primesieve -n 1

about:
  homepage: http://primesieve.org/
  license: BSD-2-Clause
  license_file: COPYING
  summary: Fast C/C++ prime number generator

extra:
  recipe-maintainers:
    - jakirkham
    - jschueller
