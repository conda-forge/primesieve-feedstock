context:
  version: "12.14"

package:
  name: primesieve
  version: ${{ version }}

source:
  url: https://github.com/kimwalisch/primesieve/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 65cf173e11bc9aff1b189f2cd19c6b6c502c30e966876b5c5ef71e138f49c8c9
  patches:
    # avoid primesieve.dll.lib
    - import.patch

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
  run_exports:
    - ${{ pin_subpackage('primesieve', upper_bound='x.x') }}

tests:
  - package_contents:
      include:
        - primesieve.h
      lib:
        - primesieve
  - script:
      # Test CLIs.
      - primesieve -n 1

about:
  homepage: http://primesieve.org/
  license: BSD-2-Clause
  license_file: COPYING
  summary: Fast C/C++ prime number generator

extra:
  recipe-maintainers:
    - jakirkham
    - jschueller
